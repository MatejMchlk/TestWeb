<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jedálny lístok</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --surface-2:#E7ECE2; --surface-3:#DCE4D5;
  --ink:#16231B; --ink-2:#4A5A4F; --ink-3:#77867B; --line:#D3DCCD;
  --basil:#2D6A4C; --basil-2:#245A40; --on-basil:#FFFFFF; --basil-soft:#DCEBDF;
  --saffron:#E0A030; --saffron-soft:#F8E8C6; --tomato:#C2412F; --tomato-soft:#F6DDD7;
  --veg:#557F25; --vegan:#1F7F63;
  --shadow:0 1px 2px rgba(22,35,27,.06), 0 8px 24px -12px rgba(22,35,27,.18);
  --font-d:"Young Serif", Georgia, "Times New Roman", serif;
  --font-b:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101813; --surface:#18221C; --surface-2:#202D25; --surface-3:#2A3A30;
    --ink:#E8EFE9; --ink-2:#AEBDB2; --ink-3:#83958A; --line:#2D3C33;
    --basil:#74C095; --basil-2:#8BD1A8; --on-basil:#0C1A12; --basil-soft:#1F3A2B;
    --saffron:#F0B955; --saffron-soft:#3A2F17; --tomato:#EC7B66; --tomato-soft:#3D221D;
    --veg:#A6CF6B; --vegan:#6FD1B0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-b);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-d);font-weight:400;line-height:1.15;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-d);font-size:1.25rem}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--basil);color:var(--on-basil);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem;cursor:pointer;background:var(--basil);color:var(--on-basil);text-decoration:none;line-height:1.2;transition:background .15s, transform .1s}
.btn:hover{background:var(--basil-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-soft:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--tomato-soft);color:var(--tomato)}
.btn-danger:hover{background:var(--tomato);color:#fff}
.btn-sm{padding:7px 13px;font-size:.85rem}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.linklike{background:none;border:0;padding:0;color:var(--basil);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}
.count{background:var(--saffron);color:#2B1D05;border-radius:999px;font-size:.75rem;padding:1px 8px;font-weight:700}

/* ---------- week bar ---------- */
.weekbar{display:flex;align-items:center;gap:14px;padding:28px 0 18px}
.week-label{flex:1;min-width:0}
.week-label h1{font-size:clamp(1.6rem,4vw,2.3rem)}
.week-label p{color:var(--ink-2);margin-top:2px}

/* ---------- day strip (the signature element) ---------- */
.daystrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding-bottom:6px}
.day-tab{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 10px 12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px;transition:border-color .15s, background .15s}
.day-tab:hover{border-color:var(--basil)}
.day-tab .dn{font-size:.85rem;color:var(--ink-2);font-weight:600}
.day-tab .dd{font-family:var(--font-d);font-size:2.3rem;line-height:1}
.day-tab .dm{font-size:.8rem;color:var(--ink-3)}
.day-tab[aria-current="true"]{background:var(--basil);border-color:var(--basil);color:var(--on-basil)}
.day-tab[aria-current="true"] .dn,.day-tab[aria-current="true"] .dm{color:inherit;opacity:.85}
.day-tab.past:not([aria-current="true"]){opacity:.62}
.day-tab .today-dot{position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:700;background:var(--saffron);color:#2B1D05;border-radius:999px;padding:1px 8px}
.day-tab .ord-dot{position:absolute;bottom:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--saffron-soft);color:var(--ink);display:grid;place-items:center}
.day-tab[aria-current="true"] .ord-dot{background:rgba(255,255,255,.22);color:inherit}
.day-tab .ord-dot svg{width:13px;height:13px}

/* ---------- day view ---------- */
.day-head{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;padding:30px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.day-head h2{font-size:clamp(1.9rem,5vw,3rem)}
.day-head .sub{color:var(--ink-2);margin-top:6px;font-size:1.05rem}
.day-intro{grid-column:1/-1;max-width:70ch;padding:14px 18px;border-radius:14px;background:var(--surface-2);display:flex;gap:14px}
.day-intro strong{display:block;font-family:var(--font-d);font-weight:400;font-size:1.15rem;margin-bottom:2px}
.day-intro p{color:var(--ink-2)}
.deadline{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--basil-soft);color:var(--basil);white-space:nowrap}
.deadline.closed{background:var(--surface-2);color:var(--ink-2)}
.deadline svg{width:16px;height:16px}

.cat{padding:26px 0 4px}
.cat-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.cat-head h3{font-size:1.45rem}
.cat-head .n{color:var(--ink-3);font-size:.9rem}
.cat-swatch{width:12px;height:12px;border-radius:4px;flex:none;align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}

/* ---------- meal card ---------- */
.meal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.meal.is-off{opacity:.72}
.photo-btn{all:unset;cursor:zoom-in;display:block;position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.photo-btn:focus-visible{outline:3px solid var(--saffron);outline-offset:-3px}
.photo-btn img{width:100%;height:100%;object-fit:cover}
.photo-tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink)}
.tag svg{width:12px;height:12px}
.tag.veg{color:var(--veg)} .tag.vegan{color:var(--vegan)}
.tag.mine{background:var(--saffron);color:#2B1D05}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--ink-3)}
.ph svg{width:30%;height:auto;opacity:.75}
.meal-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.meal-body h4{font-family:var(--font-d);font-weight:400;font-size:1.2rem;line-height:1.25;margin:0}
.meal-desc{color:var(--ink-2);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
.alg{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.alg span{min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--surface-2);color:var(--ink);font-size:.75rem;font-weight:700;display:inline-grid;place-items:center}
.rating{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;color:var(--ink-2)}
.rating svg{width:15px;height:15px;color:var(--saffron)}
.meal-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px dashed var(--line)}
.price{font-family:var(--font-d);font-size:1.3rem}
.avail{font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.avail.ok{color:var(--basil)} .avail.low{color:var(--saffron)} .avail.sold,.avail.off{color:var(--tomato)} .avail.closed{color:var(--ink-3)}
.foot-left{display:flex;flex-direction:column;gap:2px}

.empty{padding:60px 20px;text-align:center;color:var(--ink-2);max-width:46ch;margin:0 auto}
.empty h3{font-size:1.5rem;color:var(--ink);margin-bottom:8px}
.skeleton{border-radius:20px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite;aspect-ratio:4/5}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skeleton{animation:none}*{transition:none!important}}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:48px 20px 40px;color:var(--ink-3);font-size:.9rem}

/* ---------- dialogs ---------- */
dialog.dlg{border:0;padding:0;border-radius:24px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog.dlg-wide{width:min(900px,calc(100vw - 24px))}
dialog.dlg-small{width:min(420px,calc(100vw - 24px))}
dialog.dlg::backdrop{background:rgba(10,20,14,.55);backdrop-filter:blur(3px)}
dialog.dlg[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 0}
.dlg-head h2{font-size:1.5rem}
.dlg-body{padding:18px 22px 22px}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:18px}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:24px 0 0 24px;width:min(460px,100vw)}
dialog.drawer[open]{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
dialog.fullscreen{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0;background:var(--bg)}

.detail{display:grid;grid-template-columns:1.25fr 1fr}
.detail-photo{aspect-ratio:4/3;background:var(--surface-2);position:relative}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail-info{padding:24px;display:flex;flex-direction:column;gap:14px}
.detail-info h2{font-size:1.7rem}
.close-float{position:absolute;top:12px;right:12px;background:var(--surface);z-index:2}
.alg-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.9rem}
.alg-list li{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.detail{grid-template-columns:1fr}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-weight:600;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--ink-3)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--basil);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--basil)}
.alg-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--surface-2);cursor:pointer;font-size:1.2rem}
.stepper output{min-width:48px;text-align:center;font-weight:700}
.order-sum{display:flex;gap:14px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2);margin-bottom:18px}
.order-sum .thumb{width:84px;flex:none;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-3)}
.order-sum .thumb img{width:100%;height:100%;object-fit:cover}

/* my orders */
.mo-list{display:flex;flex-direction:column;gap:12px}
.mo{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px}
.mo .thumb{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.mo .thumb img{width:100%;height:100%;object-fit:cover}
.mo h4{margin:0 0 2px;font-size:1rem}
.mo .meta{font-size:.85rem;color:var(--ink-2)}
.mo .acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.mo.cancelled{opacity:.55}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;padding:2px;cursor:pointer;color:var(--line)}
.stars button.on{color:var(--saffron)}
.stars svg{width:22px;height:22px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;width:min(440px,calc(100vw - 24px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500;box-shadow:var(--shadow);animation:pop .2s ease-out}
.toast.err{background:var(--tomato);color:#fff}

/* setup screen */
.setup{max-width:640px;margin:60px auto;background:var(--surface);border-radius:24px;padding:28px;border:1px solid var(--line)}
.setup h1{font-size:1.9rem;margin-bottom:10px}
.setup ol{padding-left:20px;color:var(--ink-2)}
.setup code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:.9em}

/* ---------- admin ---------- */
.adm{min-height:100%;display:flex;flex-direction:column}
.adm-top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.adm-top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.adm-top h2{font-size:1.35rem}
.adm-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.adm-tabs button{border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.adm-tabs button[aria-selected="true"]{background:var(--basil-soft);color:var(--basil)}
.adm-main{padding:22px 0 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}
.panel h3{font-size:1.25rem;margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.toolbar .grow{flex:1}
.adm-days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.adm-days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600}
.adm-days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.adm-row{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adm-row:first-child{border-top:0}
.adm-row .thumb{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.adm-row .thumb img{width:100%;height:100%;object-fit:cover}
.adm-row .t{font-weight:600}
.adm-row .s{font-size:.85rem;color:var(--ink-2)}
.adm-row .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.adm-row{grid-template-columns:72px 1fr}.adm-row .a{grid-column:1/-1;justify-content:flex-start}}
.callout{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--saffron-soft);margin-bottom:18px}
.callout p{max-width:60ch}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.img-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.img-card .pic{aspect-ratio:4/3;background:var(--surface-2)}
.img-card .pic img{width:100%;height:100%;object-fit:cover}
.img-card .cap{padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:6px;flex:1}
.img-card .cap .u{color:var(--ink-3)}
.img-card .cap .a{display:flex;gap:6px;margin-top:auto}
button.img-card{cursor:pointer;text-align:left;padding:0;font:inherit}
button.img-card:hover{border-color:var(--basil)}
button.img-card.sel{outline:3px solid var(--basil)}
.preview{aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--surface-2);border:1px dashed var(--line);position:relative}
.preview img{width:100%;height:100%;object-fit:cover}
.preview .badge{position:absolute;left:10px;bottom:10px}
.editor{display:grid;grid-template-columns:320px 1fr;gap:24px}
@media (max-width:760px){.editor{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;color:var(--ink-2);border-top:0}
.tbl-wrap{overflow-x:auto}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sum{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum .big{font-family:var(--font-d);font-size:1.8rem;line-height:1}
.muted{color:var(--ink-2)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--basil);width:0;transition:width .2s}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .daystrip{grid-template-columns:repeat(5,minmax(76px,1fr));overflow-x:auto;scroll-snap-type:x mandatory}
  .day-tab{min-height:84px;padding:10px;scroll-snap-align:start}
  .day-tab .dd{font-size:1.8rem}
  .day-tab .today-dot{top:8px;right:8px}
  .day-head{grid-template-columns:1fr}
  .weekbar{padding-top:18px}
  .grid{grid-template-columns:1fr}
}
@media print{.topbar,.foot,.weekbar,.daystrip{display:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#" id="brandLink">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg></span>
      <span id="brandName">Jedáleň</span>
    </a>
    <button class="btn btn-ghost" id="btnMyOrders" data-act="my-orders">Moje objednávky <span class="count" id="myCount" hidden></span></button>
  </div>
</header>

<main class="wrap" id="app">
  <section class="weekbar" aria-label="Výber týždňa">
    <button class="icon-btn" data-act="week" data-dir="-1" aria-label="Predchádzajúci týždeň"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="week-label"><h1 id="weekTitle">Jedálny lístok</h1><p id="weekRange">&nbsp;</p></div>
    <button class="btn btn-soft btn-sm" data-act="week-today" id="btnThisWeek" hidden>Tento týždeň</button>
    <button class="icon-btn" data-act="week" data-dir="1" aria-label="Nasledujúci týždeň"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>

  <button class="linklike" data-act="admin">Správa jedálne</button>

<dialog id="dlg-detail" class="dlg dlg-wide"></dialog>

<dialog id="dlg-orders" class="dlg drawer"></dialog>
<dialog id="dlg-info" class="dlg"></dialog>
<dialog id="dlg-login" class="dlg dlg-small"></dialog>
<dialog id="dlg-admin" class="dlg fullscreen"></dialog>
<dialog id="dlg-meal" class="dlg dlg-wide"></dialog>
<dialog id="dlg-picker" class="dlg dlg-wide"></dialog>
<dialog id="dlg-confirm" class="dlg dlg-small"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   NASTAVENIE – sem vložte údaje zo Supabase
   (Supabase → Project Settings → API Keys / Data API)
   ===================================================================== */
const SUPABASE_URL = "SEM_VLOZ_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY = "SEM_VLOZ_PUBLISHABLE_KEY";

/* ===================================================================== */
const BUCKET = "meal-images";
const TZ = "Europe/Bratislava";
const BASE = SUPABASE_URL.trim().replace(/\/+$/, "");
const DAY_NAMES = ["Pondelok","Utorok","Streda","Štvrtok","Piatok","Sobota","Nedeľa"];
const DAY_SHORT = ["Po","Ut","St","Št","Pi","So","Ne"];
const MONTHS_GEN = ["januára","februára","marca","apríla","mája","júna","júla","augusta","septembra","októbra","novembra","decembra"];
const KIND_LABEL = {soup:"Polievka", main:"Hlavné jedlo", vegetarian:"Vegetariánske", vegan:"Vegánske", side:"Príloha / doplnok"};
const KIND_COLOR = {soup:"#E0A030", main:"#2D6A4C", vegetarian:"#557F25", vegan:"#1F7F63", side:"#B5653A"};
const LS_TOKENS = "jedalen.orderTokens";
const LS_NAME = "jedalen.customerName";
const SS_ADMIN = "jedalen.adminPassword";

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n) => n == null ? "" : new Intl.NumberFormat("sk-SK", {style:"currency", currency:"EUR"}).format(n);
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const sess = {
  get(k){ try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }
};

const ICON = {
  star:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
  leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19 13 11"/></svg>',
  sprout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 7 9 5 4 5c0 5 3 7 8 7Z"/><path d="M12 12c0-4 2.5-6 8-6 0 4-3 6-8 6Z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22" aria-hidden="true" style="flex:none;margin-top:3px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
};
const PH_ICON = {
  soup:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8 32h48a24 24 0 0 1-48 0Z"/><path d="M22 22c0-4 3-5 3-9M32 22c0-4 3-5 3-9M42 22c0-4 3-5 3-9"/></svg>',
  main:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="34" r="20"/><circle cx="32" cy="34" r="12"/><path d="M6 10v16M3 10v8a3 3 0 0 0 6 0v-8M58 10c-4 2-5 8-5 14h5v20"/></svg>',
  vegetarian:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M14 50c0-22 12-34 38-36 0 24-12 36-36 36"/><path d="M14 50 36 28"/></svg>',
  vegan:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M32 56V32"/><path d="M32 32C32 20 25 14 12 14c0 12 7 18 20 18Z"/><path d="M32 32c0-10 6-16 20-16 0 10-7 16-20 16Z"/></svg>',
  side:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M10 30h44l-5 20H15Z"/><path d="M20 30c0-8 5-14 12-14s12 6 12 14"/></svg>'
};

/* ---------- dates in Europe/Bratislava ---------- */
function nowBA(){
  const parts = new Intl.DateTimeFormat("en-GB", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).formatToParts(new Date());
  const g = t => parts.find(p => p.type === t).value;
  return {date:`${g("year")}-${g("month")}-${g("day")}`, time:`${g("hour")}:${g("minute")}`};
}
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const toISO = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = parseISO(s); d.setUTCDate(d.getUTCDate() + n); return toISO(d); };
const weekday = s => (parseISO(s).getUTCDay() + 6) % 7;
const mondayOf = s => addDays(s, -weekday(s));
function isoWeek(s){
  const d = parseISO(s); d.setUTCDate(d.getUTCDate() - weekday(s) + 3);
  const y = d.getUTCFullYear(); const jan4 = new Date(Date.UTC(y, 0, 4));
  const w1 = new Date(jan4); w1.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + 3);
  return 1 + Math.round((d - w1) / 604800000);
}
const fmtDay = s => { const d = parseISO(s); return `${d.getUTCDate()}. ${MONTHS_GEN[d.getUTCMonth()]}`; };
const fmtShort = s => { const d = parseISO(s); return `${d.getUTCDate()}. ${d.getUTCMonth()+1}.`; };
const fmtFull = s => `${DAY_NAMES[weekday(s)]} ${fmtDay(s)}`;

/* ---------- Supabase REST ---------- */
function apiHeaders(extra = {}){
  return {apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: "Bearer " + SUPABASE_PUBLISHABLE_KEY, ...extra};
}
function friendly(data, status){
  const msg = (data && (data.message || data.error_description || data.error || data.msg)) || "";
  if (/relation .* does not exist|Could not find the function|schema cache/i.test(msg)) return "Databáza ešte nie je pripravená. Spustite súbor setup.sql v Supabase.";
  if (/Invalid API key|No API key|invalid.*jwt/i.test(msg) || status === 401) return "Neplatný Supabase kľúč. Skontrolujte SUPABASE_PUBLISHABLE_KEY v súbore index.html.";
  if (/row-level security|violates/i.test(msg)) return "Operácia nie je povolená bezpečnostnými pravidlami databázy.";
  return msg || `Chyba servera (${status}).`;
}
async function request(url, opts = {}){
  let res;
  try { res = await fetch(url, opts); }
  catch { throw new Error("Nepodarilo sa spojiť so Supabase. Skontrolujte internet a SUPABASE_URL."); }
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error(friendly(data, res.status));
  return data;
}
const rest = (path) => request(`${BASE}/rest/v1/${path}`, {headers: apiHeaders()});
const rpc = (fn, args = {}) => request(`${BASE}/rest/v1/rpc/${fn}`, {method:"POST", headers: apiHeaders({"Content-Type":"application/json"}), body: JSON.stringify(args)});
const publicUrl = (path) => path ? `${BASE}/storage/v1/object/public/${BUCKET}/${path.split("/").map(encodeURIComponent).join("/")}` : "";
async function uploadToStorage(path, blob){
  return request(`${BASE}/storage/v1/object/${BUCKET}/${path}`, {
    method:"POST", headers: apiHeaders({"Content-Type": blob.type || "image/webp", "x-upsert":"false", "cache-control":"max-age=31536000"}), body: blob
  });
}
async function deleteFromStorage(path){
  return request(`${BASE}/storage/v1/object/${BUCKET}/${path}`, {method:"DELETE", headers: apiHeaders()});
}

/* ---------- UI helpers ---------- */
function toast(msg, isErr = false){
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), isErr ? 6000 : 3500);
}
function openDlg(id){ const d = document.getElementById(id); if (!d.open) d.showModal(); return d; }
function closeDlg(id){ const d = document.getElementById(id); if (d.open) d.close(); }
function askConfirm(message, okLabel = "Potvrdiť", danger = false){
  return new Promise(resolve => {
    const d = $("#dlg-confirm");
    d.innerHTML = `<div class="dlg-body"><p style="font-size:1.05rem">${esc(message)}</p>
      <div class="dlg-actions"><button class="btn btn-soft" value="no">Späť</button><button class="btn ${danger ? "btn-danger" : ""}" value="yes">${esc(okLabel)}</button></div></div>`;
    d.querySelectorAll("button").forEach(b => b.onclick = () => { d.close(); resolve(b.value === "yes"); });
    d.onclose = () => resolve(false);
    d.showModal();
  });
}
function imgHTML(path, alt, kind){
  const ph = `<div class="ph" style="background:linear-gradient(135deg, color-mix(in srgb, ${KIND_COLOR[kind] || KIND_COLOR.main} 18%, var(--surface-2)), var(--surface-2))">${PH_ICON[kind] || PH_ICON.main}</div>`;
  if (!path) return ph;
  return `<img src="${esc(publicUrl(path))}" alt="${esc(alt || "")}" loading="lazy" decoding="async" data-kind="${esc(kind || "main")}" onerror="imgFail(this)">`;
}
window.imgFail = function(img){
  const kind = img.dataset.kind || "main";
  const div = document.createElement("div");
  div.className = "ph";
  div.style.background = `linear-gradient(135deg, color-mix(in srgb, ${KIND_COLOR[kind] || KIND_COLOR.main} 18%, var(--surface-2)), var(--surface-2))`;
  div.innerHTML = PH_ICON[kind] || PH_ICON.main;
  img.replaceWith(div);
};
function starsHTML(avg, count){
  if (!count) return `<span class="rating">Zatiaľ bez hodnotenia</span>`;
  return `<span class="rating">${ICON.star}<b>${String(avg).replace(".", ",")}</b> (${count})</span>`;
}

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  today: nowBA().date,
  weekStart: mondayOf(nowBA().date),
  selected: null,
  config: {canteen_name:"Jedáleň", order_deadline:"09:30:00"},
  categories: [], catById: new Map(),
  allergens: new Map(),
  meals: [], days: new Map(), stats: new Map(),
  myOrders: [],
  loading: false
};

async function fetchWeek(monday){
  const from = monday, to = addDays(monday, 6);
  const [meals, days, stats] = await Promise.all([
    rest(`meals?select=*,image:images(id,storage_path,alt_text,title)&menu_date=gte.${from}&menu_date=lte.${to}&order=sort_order.asc,name.asc`),
    rest(`menu_days?select=*&menu_date=gte.${from}&menu_date=lte.${to}`),
    rpc("meal_stats", {p_from: from, p_to: to})
  ]);
  return {
    meals,
    days: new Map(days.map(d => [d.menu_date, d])),
    stats: new Map(stats.map(s => [s.meal_id, s]))
  };
}

async function loadBase(){
  const [cfg, cats, algs] = await Promise.all([
    rest("app_config?select=*&id=eq.1"),
    rest("categories?select=*&order=sort_order.asc,name.asc"),
    rest("allergens?select=*&order=id.asc")
  ]);
  if (cfg[0]) state.config = cfg[0];
  state.categories = cats;
  state.catById = new Map(cats.map(c => [c.id, c]));
  state.allergens = new Map(algs.map(a => [a.id, a.name]));
  $("#brandName").textContent = state.config.canteen_name;
  document.title = `Jedálny lístok – ${state.config.canteen_name}`;
}

async function loadWeek(){
  state.loading = true; renderAll();
  try {
    const w = await fetchWeek(state.weekStart);
    state.meals = w.meals; state.days = w.days; state.stats = w.stats;
  } catch (e) { toast(e.message, true); state.meals = []; }
  state.loading = false; renderAll();
}

async function loadMyOrders(){
  const tokens = store.get(LS_TOKENS, []);
  if (!tokens.length){ state.myOrders = []; updateMyCount(); return; }
  try {
    state.myOrders = await rpc("my_orders", {p_tokens: tokens});
    const valid = new Set(state.myOrders.map(o => o.token));
    store.set(LS_TOKENS, tokens.filter(t => valid.has(t)));
  } catch (e) { console.warn(e); }
  updateMyCount();
}
function updateMyCount(){
  const n = state.myOrders.filter(o => o.status === "active" && o.menu_date >= state.today).length;
  const el = $("#myCount"); el.hidden = !n; el.textContent = n;
}
const myQtyFor = (mealId) => state.myOrders.filter(o => o.meal_id === mealId && o.status === "active").reduce((s, o) => s + o.quantity, 0);

/* ---------- ordering rules ---------- */
const deadline = () => String(state.config.order_deadline || "09:30").slice(0, 5);
function orderWindowOpen(date){
  const n = nowBA();
  if (date > n.date) return true;
  if (date < n.date) return false;
  return n.time <= deadline();
}
function availability(m){
  const st = state.stats.get(m.id); const ordered = st ? st.ordered : 0;
  if (!m.is_available) return {key:"off", label:"Nedostupné", can:false};
  if (m.portions_limit != null && ordered >= m.portions_limit) return {key:"sold", label:"Vypredané", can:false};
  if (!orderWindowOpen(m.menu_date)) return {key:"closed", label: m.menu_date < nowBA().date ? "Výdaj ukončený" : "Objednávky uzavreté", can:false};
  if (m.portions_limit != null){
    const left = m.portions_limit - ordered;
    return {key: left <= 5 ? "low" : "ok", label:`Zostáva ${left} ${plural(left,"porcia","porcie","porcií")}`, can:true};
  }
  return {key:"ok", label:"Dostupné", can:true};
}
const kindOf = (m) => (state.catById.get(m.category_id) || {}).kind || "main";
const altOf = (m) => m.image_alt || (m.image && m.image.alt_text) || m.name;

/* =====================================================================
   RENDER – public view
   ===================================================================== */
function renderAll(){ renderWeekBar(); renderStrip(); renderDay(); }

function renderWeekBar(){
  const mon = state.weekStart, fri = addDays(mon, 4);
  $("#weekTitle").textContent = `Týždeň ${isoWeek(mon)}`;
  $("#weekRange").textContent = `${fmtShort(mon)} – ${fmtShort(fri)} ${parseISO(fri).getUTCFullYear()}`;
  $("#btnThisWeek").hidden = mon === mondayOf(nowBA().date);
}

function renderStrip(){
  const today = nowBA().date;
  let html = "";
  for (let i = 0; i < 5; i++){
    const d = addDays(state.weekStart, i), dt = parseISO(d);
    const mine = state.myOrders.some(o => o.menu_date === d && o.status === "active");
    html += `<button class="day-tab ${d < today ? "past" : ""}" data-act="day" data-date="${d}" aria-current="${d === state.selected}" aria-label="${fmtFull(d)}${mine ? ", máte objednané" : ""}">
      <span class="dn">${DAY_NAMES[i]}</span><span class="dd">${dt.getUTCDate()}</span><span class="dm">${MONTHS_GEN[dt.getUTCMonth()]}</span>
      ${d === today ? '<span class="today-dot">dnes</span>' : ""}
      ${mine ? `<span class="ord-dot" title="Máte objednané">${ICON.check}</span>` : ""}
    </button>`;
  }
  $("#dayStrip").innerHTML = html;
}

function renderDay(){
  const v = $("#dayView");
  const d = state.selected;
  if (state.loading){
    v.innerHTML = `<div class="day-head"><div><h2>${fmtFull(d)}</h2><p class="sub">Načítavam jedálny lístok…</p></div></div><div class="grid" style="padding-top:26px">${'<div class="skeleton"></div>'.repeat(3)}</div>`;
    return;
  }
  const meals = state.meals.filter(m => m.menu_date === d);
  const info = state.days.get(d);
  const open = orderWindowOpen(d);
  const dl = open
    ? `<span class="deadline">${ICON.clock}${d === nowBA().date ? `Objednávky dnes do ${deadline()}` : `Objednávky do ${deadline()} v deň výdaja`}</span>`
    : `<span class="deadline closed">${ICON.clock}Objednávky uzavreté</span>`;
  let html = `<div class="day-head"><div><h2>${DAY_NAMES[weekday(d)]}</h2><p class="sub">${fmtDay(d)} ${parseISO(d).getUTCFullYear()}</p></div>${meals.length ? dl : ""}
    ${info && (info.headline || info.description) ? `<div class="day-intro">${ICON.info}<div>${info.headline ? `<strong>${esc(info.headline)}</strong>` : ""}${info.description ? `<p>${esc(info.description)}</p>` : ""}</div></div>` : ""}
  </div>`;

  if (!meals.length){
    html += `<div class="empty"><h3>Menu na tento deň ešte nie je zverejnené</h3><p>Pozrite sa na iný deň alebo sa vráťte neskôr. Jedálny lístok pripravuje správca jedálne.</p></div>`;
    v.innerHTML = html; return;
  }
  const groups = new Map();
  for (const m of meals){ if (!groups.has(m.category_id)) groups.set(m.category_id, []); groups.get(m.category_id).push(m); }
  const ordered = [...groups.keys()].sort((a, b) => ((state.catById.get(a)||{}).sort_order ?? 999) - ((state.catById.get(b)||{}).sort_order ?? 999));
  for (const cid of ordered){
    const cat = state.catById.get(cid) || {name:"Ostatné", kind:"main"};
    const list = groups.get(cid);
    html += `<section class="cat" aria-label="${esc(cat.name)}"><div class="cat-head"><span class="cat-swatch" style="background:${KIND_COLOR[cat.kind]}"></span><h3>${esc(cat.name)}</h3><span class="n">${list.length} ${plural(list.length,"jedlo","jedlá","jedál")}</span></div><div class="grid">${list.map(mealCard).join("")}</div></section>`;
  }
  v.innerHTML = html;
}

function mealCard(m){
  const a = availability(m), st = state.stats.get(m.id), kind = kindOf(m), mine = myQtyFor(m.id);
  const tags = [
    m.is_vegan ? `<span class="tag vegan">${ICON.sprout}Vegánske</span>` : (m.is_vegetarian ? `<span class="tag veg">${ICON.leaf}Vegetariánske</span>` : ""),
    mine ? `<span class="tag mine">${ICON.check}Objednané ${mine}×</span>` : ""
  ].join("");
  return `<article class="meal ${a.can ? "" : "is-off"}">
    <button class="photo-btn" data-act="detail" data-id="${m.id}" aria-label="Zobraziť detail: ${esc(m.name)}">
      ${imgHTML(m.image && m.image.storage_path, altOf(m), kind)}
      <span class="photo-tags">${tags}</span>
    </button>
    <div class="meal-body">
      <h4>${esc(m.name)}</h4>
      ${m.description ? `<p class="meal-desc">${esc(m.description)}</p>` : ""}
      <div class="facts">
        ${m.weight ? `<span>Porcia <b>${esc(m.weight)}</b></span>` : ""}
        <span>Alergény ${allergenChips(m.allergens)}</span>
      </div>
      <div>${starsHTML(st && st.avg_rating, st && st.rating_count)}</div>
      <div class="meal-foot">
        <div class="foot-left"><span class="price">${money(m.price)}</span><span class="avail ${a.key}">${a.label}</span></div>
        <button class="btn btn-sm" data-act="order" data-id="${m.id}" ${a.can ? "" : "disabled"}>Objednať</button>
      </div>
    </div>
  </article>`;
}
function allergenChips(list){
  if (!list || !list.length) return `<b>bez alergénov</b>`;
  return `<span class="alg">${list.map(n => `<span title="${esc(state.allergens.get(n) || "")}">${n}</span>`).join("")}</span>`;
}

async function registerUpload(blob, title, alt){
  const ext = blob.type === "image/png" ? "png" : blob.type === "image/jpeg" ? "jpg" : "webp";
  const path = `meals/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  await uploadToStorage(path, blob);
  try { return await A("admin_register_image", {p_storage_path: path, p_title: title, p_alt_text: alt}); }
  catch (err) { try { await deleteFromStorage(path); } catch {} throw err; }
}
function resizeImage(file, max){
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("Obrázok sa nepodarilo spracovať.")), "image/webp", 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Súbor nie je platný obrázok.")); };
    img.src = url;
  });
}

/* =====================================================================
   SAMPLE PHOTO GENERATOR
   Kreslí ilustračné fotky jedál a nahrá ich do Supabase Storage.
   ===================================================================== */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function dishProfile(text, kind){
  const t = text.toLowerCase(); const has = (...w) => w.some(x => t.includes(x));
  if (kind === "soup" || has("polievk", "vývar", "minestrone", "krém s")){
    let c = "#E3B458";
    if (has("paradaj")) c = "#C9452E"; else if (has("brokol", "hrášk", "špenát")) c = "#86AA45"; else if (has("guláš", "fazu")) c = "#8E4424";
    else if (has("šošov")) c = "#B8652C"; else if (has("tekvic", "mrkv")) c = "#E2852B"; else if (has("minestrone")) c = "#C76A3C"; else if (has("vývar")) c = "#E1AE48";
    return {type:"soup", color:c, noodles: has("rezanc", "minestrone"), cream: has("krém", "smotan", "paradaj", "hrášk", "tekvic"), chunks: has("guláš", "fazu", "minestrone"), croutons: has("krutón"), seeds: has("semien")};
  }
  if (has("štrúd", "koláč")) return {type:"strudel"};
  if (has("palacin")) return {type:"crepe"};
  if (has("ovocn")) return {type:"fruit"};
  if (has("hranolk") && kind === "side") return {type:"bowl", fill:"fries"};
  if (has("šalát") && kind === "side") return {type:"bowl", fill: has("uhork") ? "cucumber" : "salad"};
  const p = {type:"plate"};
  if (has("halušk")) p.one = "halusky";
  else if (has("rizot")) p.one = "risotto";
  else if (has("špaget", "bolon")) p.one = "spaghetti";
  else if (has("penne", "cestovin")) p.one = "penne";
  else if (has("plack")) p.one = "pancakes";
  else if (has("burger")) p.protein = "burger";
  if (!p.one){
    if (has("rezeň", "vyprážan", "v cestíčku")) p.protein = has("syr") ? "cheese" : has("ryb", "tresk") ? "fishfried" : "schnitzel";
    else if (has("losos", "ryb")) p.protein = "salmon";
    else if (has("tofu")) p.protein = "tofu";
    else if (has("cícer", "šošov", "zeleninové kari")) p.protein = "curryveg";
    else if (has("kari", "sladkokys", "soté")) p.protein = "curry";
    else if (has("guláš")) p.protein = "goulash";
    else if (has("sviečk")) p.protein = "svieckova";
    else if (has("stehno")) p.protein = "leg";
    else if (has("karé", "bravč", "hovädz")) p.protein = "roast";
    else if (has("kurac", "morč", "kura")) p.protein = "chicken";
    else if (has("pečená zelenina", "quino")) p.protein = "roastveg";
    if (has("ryž")) p.side = "rice"; else if (has("knedľ")) p.side = "dumplings"; else if (has("hranolk")) p.side = "fries";
    else if (has("pyré", "kaša")) p.side = "mash"; else if (has("zemiakový šalát")) p.side = "potsalad"; else if (has("zemiak")) p.side = "potatoes";
    else if (has("quino")) p.side = "quinoa"; else if (has("rezanc")) p.side = "noodles";
    if (has("kapust")) p.extra = "cabbage"; else if (has("hrášk")) p.extra = "peas"; else if (has("brusnic")) p.extra = "cranberry"; else if (has("šalát", "zelenin")) p.extra = "greens";
    if (has("citrón")) p.lemon = true;
  }
  return p;
}

function drawDish(meal, kind){
  const W = 1200, H = 900;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const r = mulberry(hashStr(meal.id || meal.name));
  const R = (a, b) => a + r() * (b - a);
  const prof = dishProfile(`${meal.name} ${meal.description || ""}`, kind);

  // tabletop
  const tables = [["#7B5A3B","#5A3F28","wood"],["#3F4B46","#2B3531","stone"],["#CDBB9E","#B19D7F","linen"],["#8C6A4A","#6B4E35","wood"]];
  const [t1, t2, tt] = tables[Math.floor(r() * tables.length)];
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, t1); g.addColorStop(1, t2);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  if (tt === "wood"){ x.globalAlpha = .12; for (let i = 0; i < 60; i++){ x.strokeStyle = r() > .5 ? "#000" : "#fff"; x.lineWidth = R(1, 4); x.beginPath(); const y = R(0, H); x.moveTo(0, y); x.bezierCurveTo(W*.3, y + R(-30,30), W*.7, y + R(-30,30), W, y + R(-20,20)); x.stroke(); } x.globalAlpha = 1; }
  else { x.globalAlpha = .07; for (let i = 0; i < 2500; i++){ x.fillStyle = r() > .5 ? "#000" : "#fff"; x.fillRect(R(0,W), R(0,H), 2, 2); } x.globalAlpha = 1; }
  // light vignette
  const v = x.createRadialGradient(W*.45, H*.4, 100, W/2, H/2, W*.75); v.addColorStop(0, "rgba(255,255,255,.12)"); v.addColorStop(1, "rgba(0,0,0,.35)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  // napkin
  x.save(); x.translate(W*.86, H*.78); x.rotate(R(-.5, -.2)); x.shadowColor = "rgba(0,0,0,.25)"; x.shadowBlur = 20;

      case "potatoes": for (let i = 0; i < 9; i++) blob(sx + R(-80, 80), sy + R(-70, 70), R(30, 42), R(26, 36), R(0, 3), shade(sx, sy, 60, "#F3D27A", "#D2A043"), .2, 12); herbs(sx, sy, 70, 10); break;
      case "potsalad": for (let i = 0; i < 26; i++) blob(sx + R(-90, 90), sy + R(-80, 80), R(18, 26), R(14, 20), R(0, 3), "#F2E2B0", .25, 10); for (let i = 0; i < 18; i++) blob(sx + R(-90, 90), sy + R(-80, 80), 9, 7, 0, ["#E37A2B","#7AAE3E"][i % 2], .2, 8); break;
      case "mash": blob(sx, sy, 115, 100, 0, shade(sx, sy, 110, "#FFF5D6", "#E7D49C"), .1, 16); x.strokeStyle = "rgba(200,170,100,.45)"; x.lineWidth = 6; x.beginPath(); for (let a = 0; a < 14; a += .2){ const rr = a * 6; const qx = sx + Math.cos(a)*rr, qy = sy + Math.sin(a)*rr*.85; a === 0 ? x.moveTo(qx, qy) : x.lineTo(qx, qy); } x.stroke(); x.fillStyle = "#F4D35E"; blob(sx, sy - 4, 22, 16, 0, "#F6D55F", .1, 10); break;
      case "dumplings": for (let i = 0; i < 4; i++){ const bx = sx - 60 + i*42, by = sy - 30 + i*20; x.save(); x.translate(bx, by); x.rotate(.5); x.fillStyle = "#EDE5D0"; x.beginPath(); x.ellipse(0, 0, 32, 78, 0, 0, 6.28); x.fill(); x.fillStyle = "rgba(170,150,110,.45)"; for (let k = 0; k < 24; k++){ x.beginPath(); x.arc(R(-20, 20), R(-60, 60), R(2, 4), 0, 6.28); x.fill(); } x.strokeStyle = "#C9B58A"; x.lineWidth = 4; x.beginPath(); x.ellipse(0, 0, 32, 78, 0, 0, 6.28); x.stroke(); x.restore(); } break;
      case "fries": for (let i = 0; i < 30; i++){ x.save(); x.translate(sx + R(-90, 90), sy + R(-80, 80)); x.rotate(R(0, 3.14)); x.fillStyle = r() > .3 ? "#F2C14E" : "#DFA43A"; x.fillRect(-55, -8, 110, 16); x.restore(); } break;
      case "quinoa": for (let i = 0; i < 320; i++){ const a = R(0, 6.28), d = Math.sqrt(r()) * 105; x.fillStyle = r() > .5 ? "#EAD9A8" : "#CDB57A"; x.beginPath(); x.arc(sx + Math.cos(a)*d, sy + Math.sin(a)*d*.85, 4, 0, 6.28); x.fill(); } break;
      case "noodles": x.lineCap = "round"; for (let i = 0; i < 40; i++){ x.strokeStyle = "#EED597"; x.lineWidth = 7; x.beginPath(); const a0 = R(0, 6.28); for (let a = 0; a < 4; a += .3){ const rr = R(20, 100); const qx = sx + Math.cos(a0 + a)*rr, qy = sy + Math.sin(a0 + a)*rr*.85; a === 0 ? x.moveTo(qx, qy) : x.lineTo(qx, qy); } x.stroke(); } break;
    }
    // extras
    const ex = cx + 20, ey = cy + 175;
    if (P.extra === "peas" && P.side === "rice"){ for (let i = 0; i < 26; i++){ x.fillStyle = shade(sx, sy, 20, "#9BD15A", "#4F8E26"); x.beginPath(); x.arc(sx + R(-90, 90), sy + R(-75, 75), 9, 0, 6.28); x.fill(); } }
    else if (P.extra === "peas"){ for (let i = 0; i < 24; i++){ x.fillStyle = "#6FB03A"; x.beginPath(); x.arc(ex + R(-60, 60), ey + R(-30, 30), 10, 0, 6.28); x.fill(); } }
    if (P.extra === "cabbage"){ x.lineCap = "round"; for (let i = 0; i < 40; i++){ x.strokeStyle = r() > .4 ? "#7B2F6B" : "#9C4A86"; x.lineWidth = 8; x.beginPath(); const qx = ex + R(-90, 90), qy = ey + R(-40, 30); x.moveTo(qx, qy); x.quadraticCurveTo(qx + R(-30, 30), qy + R(-20, 20), qx + R(-40, 40), qy + R(-20, 20)); x.stroke(); } }
    if (P.extra === "cranberry"){ blob(ex - 60, ey - 10, 50, 36, 0, "#F8F2E7", .1, 12); for (let i = 0; i < 16; i++){ x.fillStyle = shade(ex, ey, 14, "#E24B4B", "#9C1C24"); x.beginPath(); x.arc(ex + 30 + R(-30, 30), ey + R(-20, 20), 11, 0, 6.28); x.fill(); } x.fillStyle = "#F7EFD9"; blob(ex - 60, ey - 10, 36, 26, 0, "#FFFFFF", .15, 10); }
    if (P.extra === "greens" || (!P.extra && !P.one && P.protein !== "burger")){ for (let i = 0; i < 12; i++) blob(ex + R(-70, 70), ey + R(-35, 25), R(24, 38), R(14, 22), R(0, 3), ["#5E9C35","#7DB443","#3F7A2A"][Math.floor(r()*3)], .3, 10); for (let i = 0; i < 4; i++) blob(ex + R(-60, 60), ey + R(-25, 20), 20, 20, 0, "#D63F2E", .1, 10); }
    if (P.protein === "burger" && P.side === "fries"){ /* fries already drawn */ }
    if (P.lemon){ x.save(); x.translate(px + 110, py - 100); x.rotate(.6); x.fillStyle = "#F5D23A"; x.beginPath(); x.arc(0, 0, 42, Math.PI, 0); x.fill(); x.fillStyle = "#FFF3A8"; x.beginPath(); x.arc(0, 0, 34, Math.PI, 0); x.fill(); x.strokeStyle = "#F5D23A"; x.lineWidth = 3; for (let k = 1; k < 6; k++){ const a = Math.PI + k * Math.PI / 6; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a)*34, Math.sin(a)*34); x.stroke(); } x.restore(); }
    if (["chicken","roast","leg","schnitzel"].includes(P.protein)) herbs(px - 10, py - 40, 50, 6);
  }
  return new Promise(res => c.toBlob(b => b ? res(b) : c.toBlob(res, "image/png"), "image/webp", 0.86));
}
function shadeHex(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return "#" + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, "0")).join("");
}

async function generateSamplePhotos(btn){
  const list = adm.missing; if (!list.length) return;
  if (!await askConfirm(`Vytvoriť ukážkové fotky pre ${list.length} ${plural(list.length,"jedlo","jedlá","jedál")}? Fotky sa uložia do Supabase Storage. Jedlá s rovnakým názvom dostanú spoločnú fotku.`, "Vytvoriť fotky")) return;
  btn.disabled = true;
  const prog = $("#genProg"); prog.hidden = false;
  const byName = new Map(); // same name => shared image (explicit admin choice in this dialog)
  let done = 0, failed = 0;
  for (const m of list){
    try {
      const key = m.name.trim().toLowerCase();
      let imageId = byName.get(key);
      if (!imageId){
        const kind = (state.catById.get(m.category_id) || {}).kind || "main";
        const blob = await drawDish(m, kind);
        imageId = await registerUpload(blob, m.name, `Ilustračná fotka: ${m.name}`);
        byName.set(key, imageId);
      }
      await A("admin_set_meal_image", {p_meal_id: m.id, p_image_id: imageId});
    } catch (err) {
      failed++;
      if (/heslo/i.test(err.message)){ admError(err); return; }
      console.warn(err);
      if (failed === 1) toast(err.message, true);
    }
    done++; prog.firstElementChild.style.width = `${Math.round(done / list.length * 100)}%`;
  }
  toast(failed ? `Hotovo, ${failed} fotiek sa nepodarilo vytvoriť.` : "Fotky sú vytvorené a uložené.");
  await loadImages(); await admRender();
}

  },

    catch (e) { toast(e.message, true); }
  },
  "admin": () => showLogin(),

  "adm-logout": () => admLogout(),
  "adm-tab": (el) => { adm.tab = el.dataset.tab; admRender(); },
  "adm-week": (el) => { adm.weekStart = addDays(adm.weekStart, 7 * Number(el.dataset.dir)); adm.date = adm.weekStart; admRender(); },
  "adm-day": (el) => { adm.date = el.dataset.date; admRender(); },

    const m = adm.week.meals.find(x => x.id === el.dataset.id);

    try { await A("admin_delete_meal", {p_id: m.id}); toast("Jedlo vymazané."); admRender(); } catch (e) { admError(e); }
  },
  "adm-toggle": async (el) => {
    const m = adm.week.meals.find(x => x.id === el.dataset.id);
    try { await A("admin_save_meal", {p_meal: {...m, image: undefined, is_available: !m.is_available, allergens: m.allergens.map(String), image_id: m.image_id || ""}}); admRender(); } catch (e) { admError(e); }
  },
  "adm-copy": async () => {
    const to = addDays(adm.weekStart, 7);
    if (!await askConfirm(`Skopírovať všetky jedlá z týždňa ${isoWeek(adm.weekStart)} do týždňa ${isoWeek(to)}?`, "Skopírovať")) return;
    try { const n = await A("admin_copy_week", {p_from_monday: adm.weekStart, p_to_monday: to}); toast(`Skopírovaných ${n} jedál.`); adm.weekStart = to; adm.date = to; admRender(); } catch (e) { admError(e); }
  },
  "adm-gen": (el) => generateSamplePhotos(el),
  "adm-print": () => window.print(),
  "ed-pick": () => openPicker(),
  "ed-clear": () => { ed.imageId = null; ed.imagePath = null; ed.file = null; if (ed.preview) URL.revokeObjectURL(ed.preview); ed.preview = null; const f = $("#edFile"); if (f) f.value = ""; renderEdPreview(); },
  "pick": (el) => pickImage(el.dataset.id),
  "img-edit": (el) => editImage(el.dataset.id),
  "img-del": (el) => deleteImage(el.dataset.id),
  "cat-save": (el) => saveCat(el),
  "cat-del": (el) => delCat(el)
};
document.addEventListener("click", (e) => {
  const close = e.target.closest("[data-close]");
  if (close){ e.preventDefault(); close.closest("dialog").close(); return; }
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]){ e.preventDefault(); actions[el.dataset.act](el, e); return; }
  if (e.target.tagName === "DIALOG" && !e.target.classList.contains("fullscreen")){
    const b = e.target.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) e.target.close();
  }
});
$("#brandLink").addEventListener("click", (e) => { e.preventDefault(); actions["week-today"](); });

function defaultDay(){
  const t = nowBA().date, wd = weekday(t);
  if (wd > 4) return addDays(mondayOf(t), 7);
  return t;
}

async function start(){
  if (/SEM_VLOZ/.test(SUPABASE_URL + SUPABASE_PUBLISHABLE_KEY)){
    document.querySelector(".weekbar").hidden = true;
    $("#dayView").innerHTML = `<div class="setup"><h1>Ešte chýba prepojenie so Supabase</h1>
      <p class="muted" style="margin-bottom:14px">Otvorte súbor <code>index.html</code> v Poznámkovom bloku a na začiatku skriptu vyplňte:</p>
      <ol><li><code>SUPABASE_URL</code> – Project URL, napr. <code>https://abcd1234.supabase.co</code></li>
      <li><code>SUPABASE_PUBLISHABLE_KEY</code> – Publishable key, začína <code>sb_publishable_</code></li></ol>
      <p class="muted" style="margin-top:14px">Údaje nájdete v Supabase v časti Project Settings → API Keys. Potom súbor uložte a znova nahrajte na Netlify.</p></div>`;
    return;
  }
  const t = nowBA().date;
  const dd = defaultDay();
  state.today = t; state.weekStart = mondayOf(dd); state.selected = dd;
  renderAll();
  try { await loadBase(); }
  catch (e) {
    $("#dayView").innerHTML = `<div class="setup"><h1>Jedálny lístok sa nepodarilo načítať</h1><p>${esc(e.message)}</p></div>`;
    return;
  }
  await Promise.all([loadWeek(), loadMyOrders()]);
  renderAll();
  // keep "today" & deadlines fresh
  setInterval(() => { const n = nowBA().date; if (n !== state.today){ state.today = n; } renderStrip(); renderDay(); }, 60000);
}
start();
